<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有手就行 · 搬家了</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://hands-on.withzurara.com/">
<meta http-equiv="refresh" content="3;url=https://hands-on.withzurara.com/">
<script>
/* 有手就行搬到了 hands-on.withzurara.com。
 * 跳过去时把这里的存档放进 # 后面带走（不会发到服务器），原来的 #/页面 也保留。 */
(function () {
  var to = location.hash.replace(/^#\/?/, ''), carry = {}, n = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^hands-on\.[a-z]+$/.test(k)) { carry[k] = localStorage.getItem(k); n++; }
    }
  } catch (e) {}
  var h = n ? '#carry=' + encodeURIComponent(JSON.stringify(carry)) + (to ? '&to=' + encodeURIComponent('/' + to) : '')
            : (to ? '#/' + to : '');
  location.replace('https://hands-on.withzurara.com/' + h);
})();
</script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F4EF;color:#1E6BC6;font:500 13px/1.6 'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif;letter-spacing:.12em">
<p>有手就行搬到了 <a href="https://hands-on.withzurara.com/" style="color:inherit">hands-on.withzurara.com</a></p>
</body>
</html>
